[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame_overlap"
version = "1.0.0.dev0"
description = "Bragg-edge transmission with programmable pulse patterns and frame overlap, on top of nbragg."
authors = [
    { name = "Tsviki Y. Hirsh", email = "tsviki@soreq.gov.il" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.5",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "nbragg>=1.0"
]
license = { text = "MIT" }
keywords = ["neutron", "time-of-flight", "Bragg edge", "frame overlap", "pulse pattern", "chopper", "Rietveld", "nbragg"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter", "nbconvert"]

[tool.setuptools]
package-dir = {"" = "src"}

[project.urls]
"Homepage" = "https://github.com/TsvikiHirsh/frame_overlap"
"Repository" = "https://github.com/TsvikiHirsh/frame_overlap.git"
"Issues" = "https://github.com/TsvikiHirsh/frame_overlap/issues"
