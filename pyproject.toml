[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame_overlap"
version = "1.0.0.dev0"
description = "Bragg-edge imaging with programmable, overlapping neutron pulses, on top of nbragg."
authors = [
    { name = "Tsviki Y. Hirsh", email = "tsviki@soreq.gov.il" }
]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "lmfit>=1.0",
    "nbragg>=1.0"
]
keywords = ["neutron", "time-of-flight", "Bragg edge", "frame overlap", "pulse pattern", "chopper", "Rietveld", "nbragg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "jupyter", "nbconvert", "nbformat"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
"Homepage" = "https://github.com/TsvikiHirsh/frame_overlap"
"Repository" = "https://github.com/TsvikiHirsh/frame_overlap.git"
"Issues" = "https://github.com/TsvikiHirsh/frame_overlap/issues"
